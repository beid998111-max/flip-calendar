<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>撕历 · 每日一撕，每日一思</title>
<style>
:root{
  --bg:#0d0f14;
  --bg2:#151823;
  --card:#1c2030;
  --paper:#f5f0e6;
  --paper-line:#e4dcc9;
  --ink:#2b2620;
  --accent:#e8b04b;
  --accent2:#7ec8e3;
  --text:#e8e6e1;
  --muted:#8a8fa3;
  --danger:#e07a5f;
  --ok:#81b29a;
  --radius:14px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  background:radial-gradient(ellipse at 50% -20%, #1d2333 0%, var(--bg) 60%);
  color:var(--text);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
/* ======= 顶部导航 ======= */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;max-width:1100px;margin:0 auto;
}
.logo{font-size:1.25rem;font-weight:700;letter-spacing:2px;display:flex;align-items:center;gap:10px;}
.logo .mark{width:30px;height:34px;background:var(--paper);border-radius:4px;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.4);}
.logo .mark::before{content:"";position:absolute;top:4px;left:3px;right:3px;height:3px;border-top:2px dashed #b8ac90;}
.logo .mark::after{content:"思";position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:14px;color:var(--ink);font-weight:700;}
nav{display:flex;gap:6px;background:rgba(255,255,255,.04);padding:5px;border-radius:100px;border:1px solid rgba(255,255,255,.06);}
nav button{
  border:none;background:transparent;color:var(--muted);padding:8px 20px;border-radius:100px;
  font-size:.95rem;cursor:pointer;transition:.25s;font-family:inherit;
}
nav button.active{background:var(--accent);color:#1a1408;font-weight:600;}
nav button:not(.active):hover{color:var(--text);}
.tools{display:flex;gap:8px;}
.tools button{
  border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--muted);
  padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-family:inherit;transition:.2s;
}
.tools button:hover{color:var(--text);border-color:var(--accent);}
main{max-width:1100px;margin:0 auto;padding:10px 24px 60px;}
.view{display:none;animation:fadeIn .4s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ======= 日历视图 ======= */
#view-calendar{display:none;}
#view-calendar.active{display:flex;flex-direction:column;align-items:center;gap:22px;}
.date-nav{display:flex;align-items:center;gap:18px;margin-top:6px;}
.date-nav button{
  width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.15);
  background:transparent;color:var(--text);font-size:1.1rem;cursor:pointer;transition:.2s;
}
.date-nav button:hover{background:var(--accent);color:#1a1408;border-color:var(--accent);}
.date-nav .cur{font-size:1.05rem;color:var(--muted);min-width:180px;text-align:center;}
.date-nav .cur b{color:var(--text);}
.today-btn{font-size:.8rem !important;width:auto !important;border-radius:100px !important;padding:0 14px;height:32px !important;}

/* —— 挂环 —— */
.calendar-wrap{perspective:1600px;position:relative;}
.rings{display:flex;justify-content:center;gap:60px;margin-bottom:-12px;position:relative;z-index:5;}
.ring{width:16px;height:34px;border:4px solid #b9bec9;border-radius:10px;background:transparent;box-shadow:inset 0 2px 3px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.5);}

/* —— 卡片 —— */
.card{
  width:min(400px,88vw);height:560px;position:relative;
  transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,.1,.2,1);
  cursor:pointer;
}
.card.flipped{transform:rotateY(180deg);cursor:default;}
.face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:6px 6px 10px 10px;
  overflow:hidden;box-shadow:0 25px 60px -15px rgba(0,0,0,.7);
}
/* 正面：海报 */
.front{background:var(--card);display:flex;flex-direction:column;}
.punch-strip{height:26px;background:var(--paper);border-bottom:1px dashed #c9bfa5;display:flex;justify-content:center;gap:60px;align-items:center;flex-shrink:0;}
.punch{width:10px;height:10px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
.poster{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;color:#fff;}
.poster .art{position:absolute;inset:0;}
.poster .grain{position:absolute;inset:0;opacity:.25;background-image:radial-gradient(rgba(255,255,255,.15) 1px,transparent 1px);background-size:3px 3px;pointer-events:none;}
.poster .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.25) 100%);}
.poster .date-big{position:relative;font-size:4.6rem;font-weight:800;line-height:1;font-family:Georgia,serif;text-shadow:0 4px 20px rgba(0,0,0,.5);}
.poster .date-sub{position:relative;font-size:.95rem;opacity:.85;letter-spacing:3px;margin:6px 0 20px;}
.poster .quote{position:relative;font-size:1.02rem;line-height:1.8;border-left:3px solid var(--accent);padding-left:14px;margin-bottom:10px;text-wrap:balance;}
.poster .movie{position:relative;font-size:.85rem;opacity:.75;padding-left:17px;}
.poster .badge{position:absolute;top:18px;right:20px;font-size:.72rem;letter-spacing:2px;border:1px solid rgba(255,255,255,.5);padding:4px 10px;border-radius:3px;opacity:.85;}
.flip-hint{position:absolute;bottom:14px;right:18px;font-size:.75rem;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:6px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}
.saved-dot{position:absolute;top:44px;left:20px;background:var(--ok);color:#0d1f17;font-size:.72rem;padding:4px 10px;border-radius:100px;font-weight:600;display:none;}
.card.has-entry .saved-dot{display:block;}

/* 背面：纸张 */
.back{
  transform:rotateY(180deg);background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;
  background-image:repeating-linear-gradient(transparent,transparent 31px,var(--paper-line) 31px,var(--paper-line) 32px);
  cursor:default;
}
.back .punch-strip{background:var(--paper);}
.back-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 6px;}
.back-head .d{font-size:.85rem;color:#8a7f6a;font-weight:600;}
.mode-switch{display:flex;gap:4px;background:rgba(0,0,0,.06);border-radius:8px;padding:3px;}
.mode-switch button{border:none;background:transparent;font-size:.78rem;padding:4px 10px;border-radius:6px;cursor:pointer;color:#8a7f6a;font-family:inherit;}
.mode-switch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15);}
.back-body{flex:1;padding:4px 18px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.field label{font-size:.78rem;color:#a08c62;font-weight:700;letter-spacing:1px;display:block;margin-bottom:2px;}
.field textarea{
  width:100%;border:none;background:transparent;resize:none;font-family:"Kaiti SC","STKaiti","KaiTi",serif;
  font-size:1rem;line-height:32px;color:var(--ink);outline:none;
}
.field textarea::placeholder{color:#b8ab8e;}
#f-note{height:128px;} #f-right{height:64px;} #f-wrong{height:64px;}
.tag-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:6px;}
.tag-row input{
  border:1px dashed #c0b190;background:transparent;border-radius:100px;padding:4px 12px;
  font-size:.82rem;outline:none;color:var(--ink);font-family:inherit;width:130px;
}
.tag-chip{background:#e8dfc8;color:#6b5c38;font-size:.78rem;padding:4px 11px;border-radius:100px;cursor:pointer;user-select:none;}
.tag-chip:hover{background:var(--danger);color:#fff;}
.back-foot{display:flex;gap:10px;padding:10px 18px 16px;}
.back-foot button{flex:1;border:none;border-radius:10px;padding:11px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s;}
.btn-save{background:var(--ink);color:var(--paper);}
.btn-save:hover{background:#000;}
.btn-back{background:transparent;border:1.5px solid #c0b190 !important;color:#8a7f6a;flex:0 0 90px !important;}
/* 手写画布 */
#hw-wrap{display:none;flex:1;flex-direction:column;padding:4px 18px;gap:8px;}
#hw-canvas{background:rgba(255,255,255,.4);border-radius:8px;border:1px dashed #c0b190;touch-action:none;flex:1;cursor:crosshair;}
.hw-tools{display:flex;gap:8px;}
.hw-tools button{border:1px solid #c0b190;background:transparent;border-radius:8px;padding:5px 12px;font-size:.8rem;cursor:pointer;color:#6b5c38;font-family:inherit;}

/* —— 撕页动画 —— */
.card.tearing{animation:tear 1.1s cubic-bezier(.5,-.2,.8,.6) forwards;}
@keyframes tear{
  0%{transform:rotateY(180deg) rotate(0);}
  25%{transform:rotateY(180deg) rotate(-4deg) translateY(6px);}
  100%{transform:rotateY(180deg) rotate(28deg) translate(-140%,120vh);opacity:.4;}
}
.tear-note{font-size:.85rem;color:var(--muted);}
.tear-note b{color:var(--accent);}

/* ======= 星图视图 ======= */
#view-graph .panel{position:relative;background:var(--bg2);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);overflow:hidden;}
#graph-canvas{width:100%;height:600px;display:block;cursor:grab;}
.graph-legend{position:absolute;top:14px;left:16px;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.graph-legend span{font-size:.78rem;color:var(--muted);}
.graph-tip{
  position:absolute;display:none;background:rgba(20,24,38,.96);border:1px solid rgba(255,255,255,.15);
  border-radius:10px;padding:12px 14px;max-width:260px;pointer-events:none;z-index:10;font-size:.85rem;line-height:1.6;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.graph-tip .t-date{color:var(--accent);font-weight:700;margin-bottom:4px;}
.graph-tip .t-tags{color:var(--accent2);font-size:.78rem;margin-top:4px;}
.graph-empty,.review-empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:.95rem;line-height:2;}

/* ======= 复盘视图 ======= */
.review-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.review-head select{
  background:var(--bg2);color:var(--text);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:8px 14px;font-size:.95rem;outline:none;font-family:inherit;cursor:pointer;
}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px;}
.stat{background:var(--bg2);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:18px;}
.stat .num{font-size:2rem;font-weight:800;color:var(--accent);font-family:Georgia,serif;}
.stat .lbl{font-size:.82rem;color:var(--muted);margin-top:4px;}
.review-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
@media(max-width:760px){.review-cols{grid-template-columns:1fr;}}
.rv-card{background:var(--bg2);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:20px;}
.rv-card h3{font-size:1rem;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.rv-card h3 .dot{width:8px;height:8px;border-radius:50%;}
.rv-card ul{list-style:none;display:flex;flex-direction:column;gap:10px;max-height:260px;overflow-y:auto;}
.rv-card li{font-size:.88rem;line-height:1.6;color:#c9ccd6;padding-left:14px;border-left:2px solid rgba(255,255,255,.12);}
.rv-card li .d{color:var(--muted);font-size:.75rem;margin-right:6px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar-row .name{width:90px;font-size:.85rem;color:#c9ccd6;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-row .track{flex:1;height:20px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden;}
.bar-row .fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:5px;transition:width .6s ease;}
.bar-row .cnt{width:30px;font-size:.82rem;color:var(--muted);}
.summary-box{background:linear-gradient(135deg,#1e2438,#181c2c);border:1px solid rgba(232,176,75,.25);border-radius:var(--radius);padding:24px;line-height:2;font-size:.95rem;}
.summary-box h3{color:var(--accent);margin-bottom:10px;font-size:1.05rem;}
.summary-box b{color:var(--accent2);}
/* 打卡热力条 */
.heat-strip{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px;}
.heat-cell{width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.06);position:relative;}
.heat-cell.on{background:var(--accent);}
.heat-cell.on.deep{background:#f5cd79;}
.heat-cell:hover::after{
  content:attr(data-d);position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  background:#000;padding:3px 8px;border-radius:5px;font-size:.7rem;white-space:nowrap;z-index:5;
}

/* toast */
#toast{
  position:fixed;bottom:34px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(24,28,44,.95);border:1px solid var(--accent);color:var(--text);
  padding:11px 24px;border-radius:100px;font-size:.9rem;opacity:0;transition:.35s;pointer-events:none;z-index:99;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:640px){
  header{padding:14px;flex-wrap:wrap;gap:10px;}
  nav{order:3;width:100%;justify-content:center;}
  .card{height:520px;}
}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="mark"></div>撕历</div>
  <nav>
    <button class="active" data-view="calendar">📅 日历</button>
    <button data-view="graph">✨ 星图</button>
    <button data-view="review">📊 复盘</button>
  </nav>
  <div class="tools">
    <button onclick="exportData()">导出</button>
    <button onclick="document.getElementById('import-file').click()">导入</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)">
  </div>
</header>

<main>
  <!-- ============ 日历 ============ -->
  <section class="view active" id="view-calendar">
    <div class="date-nav">
      <button onclick="shiftDay(-1)">‹</button>
      <div class="cur" id="date-label"></div>
      <button onclick="shiftDay(1)">›</button>
      <button class="today-btn" onclick="goToday()">今天</button>
    </div>

    <div class="calendar-wrap">
      <div class="rings"><div class="ring"></div><div class="ring"></div></div>
      <div class="card" id="card">
        <!-- 正面 -->
        <div class="face front">
          <div class="punch-strip"><div class="punch"></div><div class="punch"></div></div>
          <div class="poster" id="poster">
            <div class="art" id="poster-art"></div>
            <div class="grain"></div><div class="shade"></div>
            <div class="badge">DAILY FILM</div>
            <div class="saved-dot">✓ 已记录</div>
            <div class="date-big" id="p-day"></div>
            <div class="date-sub" id="p-sub"></div>
            <div class="quote" id="p-quote"></div>
            <div class="movie" id="p-movie"></div>
            <div class="flip-hint">点击翻页，写下今日 ↻</div>
          </div>
        </div>
        <!-- 背面 -->
        <div class="face back" onclick="event.stopPropagation()">
          <div class="punch-strip"><div class="punch"></div><div class="punch"></div></div>
          <div class="back-head">
            <span class="d" id="b-date"></span>
            <div class="mode-switch">
              <button class="active" id="m-type" onclick="setMode('type')">⌨ 键入</button>
              <button id="m-hand" onclick="setMode('hand')">✍ 手写</button>
            </div>
          </div>
          <div class="back-body" id="type-wrap">
            <div class="field"><label>今日收获 / 心得</label>
              <textarea id="f-note" placeholder="今天发生了什么，学到了什么…"></textarea></div>
            <div class="field"><label>✓ 做对了什么</label>
              <textarea id="f-right" placeholder="值得延续的决定或行为…"></textarea></div>
            <div class="field"><label>✗ 待改进什么</label>
              <textarea id="f-wrong" placeholder="下次可以怎么做得更好…"></textarea></div>
            <div class="tag-row" id="tag-row">
              <input id="tag-input" placeholder="+ 标签，回车添加">
            </div>
          </div>
          <div id="hw-wrap">
            <canvas id="hw-canvas"></canvas>
            <div class="hw-tools">
              <button onclick="hwClear()">清空</button>
              <span style="font-size:.78rem;color:#8a7f6a;align-self:center;">手写内容会随当天记录一起保存</span>
            </div>
          </div>
          <div class="back-foot">
            <button class="btn-back" onclick="flipBack()">翻回</button>
            <button class="btn-save" onclick="saveEntry()">保存并撕下这一页 ✂</button>
          </div>
        </div>
      </div>
    </div>
    <div class="tear-note">已坚持记录 <b id="streak-n">0</b> 天 · 累计 <b id="total-n">0</b> 篇</div>
  </section>

  <!-- ============ 星图 ============ -->
  <section class="view" id="view-graph">
    <div class="panel">
      <canvas id="graph-canvas"></canvas>
      <div class="graph-legend">
        <span>⭐ 每颗星 = 一天的记录，越亮越近</span>
        <span>— 连线 = 共享同一个标签（星座）</span>
        <span>🖱 悬停查看 · 点击跳转当天 · 拖拽平移</span>
      </div>
      <div class="graph-tip" id="graph-tip"></div>
      <div class="graph-empty" id="graph-empty" style="display:none;">
        还没有星星 ✨<br>去日历里写下第一篇记录，星空就会亮起来
      </div>
    </div>
  </section>

  <!-- ============ 复盘 ============ -->
  <section class="view" id="view-review">
    <div class="review-head">
      <h2 style="font-size:1.2rem;">月度复盘</h2>
      <select id="month-sel" onchange="renderReview()"></select>
    </div>
    <div id="review-body"></div>
  </section>
</main>

<div id="toast"></div>

<script>
/* ==================== 数据层 ==================== */
const STORE_KEY = 'tearoff-calendar-v1';
let DB = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); // { 'YYYY-MM-DD': {note,right,wrong,tags:[],hw:dataURL,ts} }
function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ==================== 每日电影台词库 ==================== */
const QUOTES = [
 ["生活就像一盒巧克力，你永远不知道下一颗是什么味道。","《阿甘正传》 Forrest Gump · 1994",[210,60,45]],

 ["曾经有一份真诚的爱情放在我面前，我没有珍惜。","《大话西游》 A Chinese Odyssey · 1995",[280,50,45]],
 ["有些鸟儿是关不住的，它们的每一片羽毛都闪耀着自由的光辉。","《肖申克的救赎》 The Shawshank Redemption · 1994",[200,65,40]],
 ["念念不忘，必有回响。","《一代宗师》 The Grandmaster · 2013",[220,40,35]],
 ["做人如果没有梦想，跟咸鱼有什么分别？","《少林足球》 Shaolin Soccer · 2001",[45,80,50]],
 ["世界上只有一种真正的英雄主义，就是认清生活真相后依然热爱生活。","《本杰明·巴顿奇事》",[170,50,40]],
 ["星星发亮，是为了让每一个人有一天都能找到属于自己的星星。","《小王子》 The Little Prince · 2015",[240,60,50]],
 ["人生就是不断地放下，但最遗憾的是，我们来不及好好告别。","《少年派的奇幻漂流》 Life of Pi · 2012",[190,70,45]],
 ["今天的你比昨天的你多了一天的经历，这就是成长。","《白日梦想家》 The Secret Life of Walter Mitty",[35,75,55]],
 ["取悦自己，比取悦别人重要得多。","《怦然心动》 Flipped · 2010",[330,55,55]],
 ["无论结局好坏，你都不能否认过程的精彩。","《爱乐之城》 La La Land · 2016",[260,60,50]],

function dayOfYear(d){ return Math.floor((d - new Date(d.getFullYear(),0,0)) / 864e5); }
function quoteFor(d){ return QUOTES[(dayOfYear(d) + d.getFullYear()) % QUOTES.length]; }
const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

/* ==================== 日历渲染 ==================== */
let curDate = new Date();
const card = document.getElementById('card');
let curTags = [];

function renderDay(){
  const key = fmt(curDate);
  const q = quoteFor(curDate);
  const [h,s,l] = q[2];
  document.getElementById('poster-art').style.background =
    `linear-gradient(160deg, hsl(${h},${s}%,${l+18}%) 0%, hsl(${h},${s}%,${Math.max(l-8,12)}%) 45%, hsl(${(h+40)%360},${s-10}%,${Math.max(l-18,8)}%) 100%)`;
  document.getElementById('p-day').textContent = curDate.getDate();
  document.getElementById('p-sub').textContent =
    `${curDate.getFullYear()} 年 ${curDate.getMonth()+1} 月 · ${WEEK[curDate.getDay()]}`;
  document.getElementById('p-quote').textContent = q[0];
  document.getElementById('p-movie').textContent = '—— ' + q[1];
  document.getElementById('date-label').innerHTML =
    `<b>${curDate.getFullYear()}.${String(curDate.getMonth()+1).padStart(2,'0')}.${String(curDate.getDate()).padStart(2,'0')}</b> ${WEEK[curDate.getDay()]}`;
  document.getElementById('b-date').textContent = key + ' · 今日手记';

  const e = DB[key];
  card.classList.toggle('has-entry', !!e);
  document.getElementById('f-note').value  = e?.note  || '';
  document.getElementById('f-right').value = e?.right || '';
  document.getElementById('f-wrong').value = e?.wrong || '';
  curTags = e?.tags ? [...e.tags] : [];
  renderTags();
  hwClear(true);
  if(e?.hw){ const img = new Image(); img.onload = ()=> hwCtx.drawImage(img,0,0); img.src = e.hw; }
  card.classList.remove('flipped','tearing');
  updateStats();
}
function shiftDay(n){ curDate.setDate(curDate.getDate()+n); renderDay(); }
function goToday(){ curDate = new Date(); renderDay(); }
window.gotoDate = function(key){
  const [y,m,d] = key.split('-').map(Number);
  curDate = new Date(y,m-1,d);
  switchView('calendar'); renderDay();
  setTimeout(()=> card.classList.add('flipped'), 350);
};

card.addEventListener('click', e=>{
  if(!card.classList.contains('flipped')){ card.classList.add('flipped'); setTimeout(resizeHw, 500); }
});
function flipBack(){ card.classList.remove('flipped'); }

/* ==================== 标签 ==================== */
function renderTags(){
  const row = document.getElementById('tag-row');
  row.querySelectorAll('.tag-chip').forEach(c=>c.remove());
  const input = document.getElementById('tag-input');
  curTags.forEach(t=>{
    const chip = document.createElement('span');
    chip.className = 'tag-chip'; chip.textContent = '# '+t;
    chip.title = '点击删除';
    chip.onclick = ()=>{ curTags = curTags.filter(x=>x!==t); renderTags(); };
    row.insertBefore(chip, input);
  });
}
document.getElementById('tag-input').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    const v = e.target.value.trim().replace(/^#/,'');
    if(v && !curTags.includes(v)) curTags.push(v);
    e.target.value=''; renderTags();
  }
});

/* ==================== 手写板 ==================== */
const hwCanvas = document.getElementById('hw-canvas');
const hwCtx = hwCanvas.getContext('2d');
let hwDrawing = false, hwDirty = false;
function resizeHw(){
  const r = hwCanvas.getBoundingClientRect();
  if(r.width === 0) return;
  const old = hwCanvas.toDataURL();
  hwCanvas.width = r.width * 2; hwCanvas.height = r.height * 2;
  hwCtx.scale(2,2);
  hwCtx.lineCap='round'; hwCtx.lineJoin='round'; hwCtx.strokeStyle='#2b2620'; hwCtx.lineWidth=2.2;
  const img = new Image(); img.onload = ()=> hwCtx.drawImage(img,0,0,r.width,r.height); img.src = old;
}
function hwPos(e){
  const r = hwCanvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return [p.clientX - r.left, p.clientY - r.top];
}
function hwStart(e){ e.preventDefault(); hwDrawing = true; hwDirty = true; const [x,y]=hwPos(e); hwCtx.beginPath(); hwCtx.moveTo(x,y); }
function hwMove(e){ if(!hwDrawing) return; e.preventDefault(); const [x,y]=hwPos(e); hwCtx.lineTo(x,y); hwCtx.stroke(); }
function hwEnd(){ hwDrawing = false; }
hwCanvas.addEventListener('mousedown',hwStart); hwCanvas.addEventListener('mousemove',hwMove);
window.addEventListener('mouseup',hwEnd);
hwCanvas.addEventListener('touchstart',hwStart,{passive:false});
hwCanvas.addEventListener('touchmove',hwMove,{passive:false});
hwCanvas.addEventListener('touchend',hwEnd);
function hwClear(silent){ hwCtx.clearRect(0,0,hwCanvas.width,hwCanvas.height); hwDirty=false; if(!silent) toast('画布已清空'); }
function setMode(m){
  document.getElementById('m-type').classList.toggle('active', m==='type');
  document.getElementById('m-hand').classList.toggle('active', m==='hand');
  document.getElementById('type-wrap').style.display = m==='type' ? 'flex' : 'none';
  document.getElementById('hw-wrap').style.display   = m==='hand' ? 'flex' : 'none';
  if(m==='hand') setTimeout(resizeHw, 50);
}

/* ==================== 保存 & 撕页 ==================== */
function saveEntry(){
  const key = fmt(curDate);
  const note  = document.getElementById('f-note').value.trim();
  const right = document.getElementById('f-right').value.trim();
  const wrong = document.getElementById('f-wrong').value.trim();
  const hasHw = hwDirty || (DB[key] && DB[key].hw);
  if(!note && !right && !wrong && !hasHw && curTags.length===0){ toast('先写点什么吧 ✍️'); return; }
  DB[key] = {
    note, right, wrong, tags:[...curTags],
    hw: hwDirty ? hwCanvas.toDataURL('image/png') : (DB[key]?.hw || null),
    ts: Date.now()
  };
  persist();
  card.classList.add('tearing');
  toast('这一页已撕下收好 ✂ 已存入你的知识库');
  setTimeout(()=>{ renderDay(); }, 1150);
}

/* ==================== 统计 ==================== */
function updateStats(){
  const keys = Object.keys(DB).sort();
  document.getElementById('total-n').textContent = keys.length;
  // 连续天数（从今天往回数）
  let streak = 0; const d = new Date();
  if(!DB[fmt(d)]) d.setDate(d.getDate()-1); // 今天没写不打断昨天的连击
  while(DB[fmt(d)]){ streak++; d.setDate(d.getDate()-1); }
  document.getElementById('streak-n').textContent = streak;
}

  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+name));

}

/* ==================== 星图 ==================== */
const gCanvas = document.getElementById('graph-canvas');
const gCtx = gCanvas.getContext('2d');
let gNodes = [], gEdges = [], gRAF = null, gOffset = {x:0,y:0}, gDrag = null;
const TAG_COLORS = ['#e8b04b','#7ec8e3','#e07a5f','#81b29a','#c792ea','#f78fb3','#f5cd79','#63cdda'];

function initGraph(){
  const keys = Object.keys(DB).sort();
  document.getElementById('graph-empty').style.display = keys.length ? 'none' : 'block';
  const rect = gCanvas.parentElement.getBoundingClientRect();
  gCanvas.width = rect.width * 2; gCanvas.height = 600 * 2;
  gCanvas.style.height = '600px';
  gCtx.setTransform(2,0,0,2,0,0);
  const W = rect.width, H = 600;

  // 节点：按时间螺旋布局 + 随机扰动
  const rnd = s => { let x = Math.sin(s*127.1)*43758.5453; return x - Math.floor(x); };
  gNodes = keys.map((k,i)=>{
    const angle = i * 0.9 + rnd(i)*0.5;
    const r = 60 + i * (Math.min(W,H)/2 - 90) / Math.max(keys.length,1);
    return {
      key:k, e:DB[k],
      x: W/2 + Math.cos(angle)*r + (rnd(i+7)-0.5)*40,
      y: H/2 + Math.sin(angle)*r*0.75 + (rnd(i+13)-0.5)*40,
      size: 3 + Math.min((DB[k].note||'').length/40, 5) + (DB[k].tags?.length||0),
      tw: rnd(i+3)*Math.PI*2
    };
  });
  // 边：共享标签
  gEdges = [];
  const tagIndex = {};
  gNodes.forEach((n,i)=> (n.e.tags||[]).forEach(t=>{ (tagIndex[t] = tagIndex[t]||[]).push(i); }));
  const allTags = Object.keys(tagIndex);
  Object.entries(tagIndex).forEach(([t,idxs])=>{
    const c = TAG_COLORS[allTags.indexOf(t) % TAG_COLORS.length];
    for(let i=0;i<idxs.length-1;i++) gEdges.push({a:idxs[i], b:idxs[i+1], color:c, tag:t});
  });
  // 背景星
  gBgStars = Array.from({length:120},(_,i)=>({x:rnd(i*2)*W, y:rnd(i*2+1)*H, s:rnd(i*3)*1.2+0.3, tw:rnd(i*5)*Math.PI*2}));
  if(gRAF) cancelAnimationFrame(gRAF);
  drawGraph(W,H);
}
let gBgStars = [];
function drawGraph(W,H){
  const t = performance.now()/1000;
  gCtx.clearRect(0,0,W,H);
  // 深空背景
  const grad = gCtx.createRadialGradient(W/2,H/2,50,W/2,H/2,Math.max(W,H)/1.2);
  grad.addColorStop(0,'#141a2e'); grad.addColorStop(1,'#0a0c14');
  gCtx.fillStyle = grad; gCtx.fillRect(0,0,W,H);
  gCtx.save(); gCtx.translate(gOffset.x, gOffset.y);
  // 背景星
  gBgStars.forEach(s=>{
    gCtx.globalAlpha = 0.3 + 0.3*Math.sin(t*1.5 + s.tw);
    gCtx.fillStyle = '#fff';
    gCtx.beginPath(); gCtx.arc(s.x, s.y, s.s, 0, 7); gCtx.fill();
  });
  gCtx.globalAlpha = 1;
  // 边
  gEdges.forEach(ed=>{
    const a = gNodes[ed.a], b = gNodes[ed.b];
    gCtx.strokeStyle = ed.color; gCtx.globalAlpha = 0.35; gCtx.lineWidth = 1;
    gCtx.beginPath(); gCtx.moveTo(a.x,a.y); gCtx.lineTo(b.x,b.y); gCtx.stroke();
  });
  gCtx.globalAlpha = 1;
  // 节点
  gNodes.forEach(n=>{
    const glow = 0.6 + 0.4*Math.sin(t*2 + n.tw);
    const c = (n.e.tags && n.e.tags.length) ? TAG_COLORS[0] : '#aab6d8';
    gCtx.shadowColor = '#e8b04b'; gCtx.shadowBlur = 12*glow;
    gCtx.fillStyle = n===gHover ? '#fff' : `rgba(245,220,160,${0.75+0.25*glow})`;
    gCtx.beginPath(); gCtx.arc(n.x, n.y, n.size, 0, 7); gCtx.fill();
    gCtx.shadowBlur = 0;
  });
  gCtx.restore();
  gRAF = requestAnimationFrame(()=>drawGraph(W,H));
}
let gHover = null;
gCanvas.addEventListener('mousemove', e=>{
  const r = gCanvas.getBoundingClientRect();
  const mx = e.clientX - r.left - gOffset.x, my = e.clientY - r.top - gOffset.y;
  if(gDrag){ gOffset.x = e.clientX - gDrag.x; gOffset.y = e.clientY - gDrag.y; return; }
  gHover = gNodes.find(n => Math.hypot(n.x-mx, n.y-my) < n.size + 6) || null;
  gCanvas.style.cursor = gHover ? 'pointer' : 'grab';
  const tip = document.getElementById('graph-tip');
  if(gHover){
    const e2 = gHover.e;
    tip.innerHTML = `<div class="t-date">${gHover.key}</div>
      <div>${(e2.note||'(手写记录)').slice(0,60)}${(e2.note||'').length>60?'…':''}</div>
      ${e2.tags?.length ? `<div class="t-tags">${e2.tags.map(t=>'#'+t).join(' ')}</div>` : ''}`;
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX - r.left + 16, r.width - 270) + 'px';
    tip.style.top  = (e.clientY - r.top + 16) + 'px';
  } else tip.style.display = 'none';
});
gCanvas.addEventListener('mousedown', e=>{
  if(gHover){ gotoDate(gHover.key); return; }
  gDrag = {x: e.clientX - gOffset.x, y: e.clientY - gOffset.y};
  gCanvas.style.cursor = 'grabbing';
});
window.addEventListener('mouseup', ()=>{ gDrag = null; });

/* ==================== 复盘 ==================== */
function buildMonthOptions(){
  const sel = document.getElementById('month-sel');
  const months = [...new Set(Object.keys(DB).map(k=>k.slice(0,7)))].sort().reverse();
  const nowM = fmt(new Date()).slice(0,7);
  if(!months.includes(nowM)) months.unshift(nowM);
  const prev = sel.value;
  sel.innerHTML = months.map(m=>`<option value="${m}">${m.replace('-',' 年 ')} 月</option>`).join('');
  if(months.includes(prev)) sel.value = prev;
}
function renderReview(){
  const m = document.getElementById('month-sel').value;
  const body = document.getElementById('review-body');
  const entries = Object.entries(DB).filter(([k])=>k.startsWith(m)).sort();
  if(!entries.length){
    body.innerHTML = `<div class="review-empty">这个月还没有记录 📭<br>回到日历，从今天开始撕下第一页吧</div>`;
    return;
  }
  const [y,mo] = m.split('-').map(Number);
  const daysInMonth = new Date(y, mo, 0).getDate();
  const totalWords = entries.reduce((s,[,e])=>s+(e.note||'').length+(e.right||'').length+(e.wrong||'').length,0);
  // 标签统计
  const tagCnt = {};
  entries.forEach(([,e])=>(e.tags||[]).forEach(t=>tagCnt[t]=(tagCnt[t]||0)+1));
  const topTags = Object.entries(tagCnt).sort((a,b)=>b[1]-a[1]);
  const maxTag = topTags[0]?.[1] || 1;
  // 最长连续
  let best=0, cur=0, prevD=null;
  entries.forEach(([k])=>{
    const d = new Date(k);
    cur = (prevD && (d - prevD === 864e5)) ? cur+1 : 1;
    best = Math.max(best,cur); prevD = d;
  });
  const rights = entries.filter(([,e])=>e.right).map(([k,e])=>({k,v:e.right}));
  const wrongs = entries.filter(([,e])=>e.wrong).map(([k,e])=>({k,v:e.wrong}));
  // 热力条
  const heat = Array.from({length:daysInMonth},(_,i)=>{
    const key = `${m}-${String(i+1).padStart(2,'0')}`;
    const e = DB[key];
    const cls = e ? ((e.note||'').length>80 ? 'on deep' : 'on') : '';
    return `<div class="heat-cell ${cls}" data-d="${i+1}日${e?' ✓':''}"></div>`;
  }).join('');
  // 自动总结
  const rate = Math.round(entries.length/daysInMonth*100);
  const summary = `本月你一共记录了 <b>${entries.length}</b> 天（覆盖率 ${rate}%），写下约 <b>${totalWords}</b> 字，最长连续坚持 <b>${best}</b> 天。`
    + (topTags.length ? `你的精力主要投入在 <b>${topTags.slice(0,3).map(t=>'#'+t[0]).join('、')}</b> 上。` : '本月还没有打标签，建议为每天的记录加 1-2 个标签，星图和分类统计会更好用。')
    + (rights.length ? `有 <b>${rights.length}</b> 天明确写下了「做对的事」——把它们变成习惯。` : '')
    + (wrongs.length ? `同时有 <b>${wrongs.length}</b> 天记录了「待改进」，翻回去看看，哪些问题在重复出现？重复出现的问题才是真正值得系统性解决的。` : '')
    + (rate < 50 ? ' 下个月试着把覆盖率提到 50% 以上——记录密度决定了复盘的质量。' : ' 保持这个节奏，你正在把日子过成一个可检索的知识库。');

  body.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="num">${entries.length}<span style="font-size:1rem;color:var(--muted);">/${daysInMonth}</span></div><div class="lbl">记录天数</div></div>
      <div class="stat"><div class="num">${totalWords}</div><div class="lbl">累计字数</div></div>
      <div class="stat"><div class="num">${best}</div><div class="lbl">最长连续（天）</div></div>
      <div class="stat"><div class="num">${topTags.length}</div><div class="lbl">涉及主题数</div></div>
    </div>
    <div class="rv-card" style="margin-bottom:18px;">
      <h3><span class="dot" style="background:var(--accent);"></span>本月打卡足迹</h3>
      <div class="heat-strip">${heat}</div>
    </div>
    <div class="review-cols">
      <div class="rv-card">
        <h3><span class="dot" style="background:var(--ok);"></span>做对了什么（${rights.length}）</h3>
        ${rights.length ? `<ul>${rights.map(r=>`<li><span class="d">${r.k.slice(5)}</span>${esc(r.v)}</li>`).join('')}</ul>` : '<p style="color:var(--muted);font-size:.85rem;">暂无记录</p>'}
      </div>
      <div class="rv-card">
        <h3><span class="dot" style="background:var(--danger);"></span>待改进什么（${wrongs.length}）</h3>
        ${wrongs.length ? `<ul>${wrongs.map(r=>`<li><span class="d">${r.k.slice(5)}</span>${esc(r.v)}</li>`).join('')}</ul>` : '<p style="color:var(--muted);font-size:.85rem;">暂无记录</p>'}
      </div>
    </div>
    ${topTags.length ? `<div class="rv-card" style="margin-bottom:18px;">
      <h3><span class="dot" style="background:var(--accent2);"></span>主题分布</h3>
      ${topTags.slice(0,8).map(([t,c])=>`
        <div class="bar-row"><div class="name"># ${esc(t)}</div>
        <div class="track"><div class="fill" style="width:${c/maxTag*100}%"></div></div>
        <div class="cnt">${c}</div></div>`).join('')}
    </div>` : ''}
    <div class="summary-box"><h3>🤖 本月洞察</h3><p>${summary}</p></div>`;
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ==================== 导入导出 ==================== */
function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `撕历备份_${fmt(new Date())}.json`;
  a.click();
  toast('已导出 JSON 备份');
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      DB = {...DB, ...data}; persist();
      renderDay(); toast(`导入成功，共 ${Object.keys(DB).length} 条记录`);
    }catch{ toast('文件格式不正确'); }
  };
  reader.readAsText(f);
  input.value = '';
}

/* ==================== toast ==================== */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
